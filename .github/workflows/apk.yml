# Android uygulamasını (APK) GitHub'ın sunucusunda derler ve "Releases" bölümüne "apk-test" olarak koyar.
name: APK derle
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'index.html', '.github/workflows/apk.yml']
permissions:
  contents: write
concurrency: { group: apk, cancel-in-progress: true }
jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Uygulama dosyalarını hazırla
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -e
          A=android/app/src/main/assets
          mkdir -p $A/www $A/cdn/ort-1.20.1 $A/cdn/ort-1.22.0 $A/cdn/lamejs $A/models
          cp index.html $A/www/index.html
          mkdir -p /tmp/npm && cd /tmp/npm
          for v in 1.20.1 1.22.0; do
            npm pack onnxruntime-web@$v --silent >/dev/null; mkdir -p o$v; tar xzf onnxruntime-web-$v.tgz -C o$v
            cp o$v/package/dist/ort.min.js o$v/package/dist/ort.webgpu.min.js $GITHUB_WORKSPACE/$A/cdn/ort-$v/ 2>/dev/null || true
            cp o$v/package/dist/ort-wasm-simd-threaded*.mjs o$v/package/dist/ort-wasm-simd-threaded*.wasm $GITHUB_WORKSPACE/$A/cdn/ort-$v/
            cp o$v/package/LICENSE* $GITHUB_WORKSPACE/$A/cdn/ort-$v/ 2>/dev/null || true
          done
          npm pack lamejs@1.2.1 --silent >/dev/null; mkdir -p l; tar xzf lamejs-1.2.1.tgz -C l
          cp l/package/lame.min.js $GITHUB_WORKSPACE/$A/cdn/lamejs/; cp l/package/LICENSE* $GITHUB_WORKSPACE/$A/cdn/lamejs/ 2>/dev/null || true
          cd $GITHUB_WORKSPACE
          gh release download modeller-2026-11-14 -p UVR-MDX-NET-Voc_FT.onnx -p MODEL-LISANSLARI.md -D $A/models
          # yazı tipleri (internetsiz de aynı görünüm): sayfanın kullandığı Google Fonts adresi
          mkdir -p $A/fonts
          FURL=$(grep -o 'https://fonts.googleapis.com/css2[^"]*' index.html | head -1 | sed 's/&amp;/\&/g')
          curl -fsSL -A "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36" "$FURL" -o $A/fonts/fonts.css
          for u in $(grep -o 'https://fonts.gstatic.com/[^)]*' $A/fonts/fonts.css | sort -u); do f=$(echo "${u#https://fonts.gstatic.com/}" | tr '/' '_'); curl -fsSL "$u" -o "$A/fonts/$f"; done
          ls $A/fonts | head; du -sh $A/fonts
          du -sh $A/*; ls -la $A/cdn/*
      - name: Derle
        working-directory: android
        env: { KARAR_SURUM: 'test-${{ github.run_number }}' }
        run: gradle --no-daemon assembleRelease
      - name: Sürüme koy
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -e
          cp android/app/build/outputs/apk/release/app-release.apk KararEslestirici-test.apk
          ls -la KararEslestirici-test.apk
          gh release delete apk-test -y --cleanup-tag 2>/dev/null || true
          gh release create apk-test KararEslestirici-test.apk --prerelease --title "Test APK (derleme ${{ github.run_number }})" \
            --notes "Deneme sürümü. Tablete indirip kur: dosyaya dokun, 'bilinmeyen kaynaklardan yüklemeye' izin ver. Test imzasıyla imzalıdır; Google Play sürümü değildir. Kaynak: ${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: KararEslestirici-test.apk, retention-days: 3 }
  emulator-testi:
    needs: derle
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: apk }
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Deneme sesi ve araçlar
        run: |
          pip install websocket-client
          python3 -c "
          import wave,math,random,struct
          sr=44100;n=sr*30;w=wave.open('deneme.wav','wb');w.setnchannels(1);w.setsampwidth(2);w.setframerate(sr)
          w.writeframes(b''.join(struct.pack('<h',int(9000*(0.5*math.sin(2*math.pi*196*i/sr)+0.4*math.sin(2*math.pi*587*i/sr)*(1+math.sin(i/sr*3))/2+0.05*random.uniform(-1,1)))) for i in range(n)));w.close()"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 4G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash android/test/emu_test.sh
      - name: Sonuçları sürüme ekle
        if: always()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cd test-sonuc && ls -la && cat 2-sayfa.txt 3-sira.txt || true
          for f in *; do gh release upload apk-test "$f" --clobber -R ${{ github.repository }} || true; done
